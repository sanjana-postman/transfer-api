$kind: http-example
request:
  url: "{{baseUrl}}/transfers/fees"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "amount": 3347.999365741228,
        "type": "ach",
        "currency": "string"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "amount": "<double>",
        "currency": "<string>",
        "type": "rtp",
        "fee": "<double>",
        "estimatedDelivery": "1958-02-04"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "amount": {
            "type": "number",
            "example": 2500,
            "description": "The transfer amount provided",
            "format": "double"
          },
          "currency": {
            "type": "string",
            "example": "USD"
          },
          "type": {
            "type": "string",
            "enum": [
              "ach",
              "wire",
              "rtp"
            ],
            "description": "Payment rail type:\n- `ach`: Automated Clearing House — standard domestic (1-3 business days)\n- `wire`: Wire transfer — same-day domestic and international\n- `rtp`: Real-Time Payments — instant, domestic only\n"
          },
          "fee": {
            "type": "number",
            "example": 0.5,
            "description": "Estimated fee for the transfer",
            "format": "double"
          },
          "estimatedDelivery": {
            "type": "string",
            "example": "2023-05-30T17:00:00Z",
            "description": "Estimated delivery date and time",
            "format": "date-time"
          }
        }
      }
order: 1000
