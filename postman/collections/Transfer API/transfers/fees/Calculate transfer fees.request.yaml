$kind: http-request
description: Get a fee estimate for a transfer based on amount, type, and currency.
url: "{{baseUrl}}/transfers/fees"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "amount": 3347.999365741228,
      "type": "ach",
      "currency": "string"
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "amount": {
          "type": "number",
          "minimum": 0.01,
          "example": 2500,
          "description": "Transfer amount",
          "format": "double"
        },
        "type": {
          "type": "string",
          "enum": [
            "ach",
            "wire",
            "rtp"
          ],
          "description": "Payment rail type:\n- `ach`: Automated Clearing House — standard domestic (1-3 business days)\n- `wire`: Wire transfer — same-day domestic and international\n- `rtp`: Real-Time Payments — instant, domestic only\n"
        },
        "currency": {
          "type": "string",
          "example": "USD",
          "description": "ISO 4217 currency code"
        }
      },
      "required": [
        "amount",
        "type",
        "currency"
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
examples: ./.resources/Calculate transfer fees.resources/examples
order: 1000
