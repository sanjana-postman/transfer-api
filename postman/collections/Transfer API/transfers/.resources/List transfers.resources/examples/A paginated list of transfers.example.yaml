$kind: http-example
request:
  url: "{{baseUrl}}/transfers?fromDate=<date>&toDate=<date>&status=failed&type=wire&limit=20&offset=0"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: fromDate
      value: <date>
      disabled: false
      description: Filter start date
    - key: toDate
      value: <date>
      disabled: false
      description: Filter end date
    - key: status
      value: failed
      disabled: false
      description: Filter by transfer status
    - key: type
      value: wire
      disabled: false
      description: Filter by transfer type
    - key: limit
      value: "20"
      disabled: false
      description: Maximum number of results to return
    - key: offset
      value: "0"
      disabled: false
      description: Pagination offset
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": [
          {
            "transferId": "<string>",
            "sourceAccountId": "<string>",
            "beneficiaryId": "<string>",
            "amount": "<double>",
            "currency": "<string>",
            "type": "wire",
            "status": "processing",
            "fee": "<double>",
            "memo": "<string>",
            "estimatedDelivery": "<dateTime>",
            "createdAt": "<dateTime>",
            "updatedAt": "<dateTime>"
          },
          {
            "transferId": "<string>",
            "sourceAccountId": "<string>",
            "beneficiaryId": "<string>",
            "amount": "<double>",
            "currency": "<string>",
            "type": "ach",
            "status": "scheduled",
            "fee": "<double>",
            "memo": "<string>",
            "estimatedDelivery": "<dateTime>",
            "createdAt": "<dateTime>",
            "updatedAt": "<dateTime>"
          }
        ],
        "total": "<integer>",
        "limit": "<integer>",
        "offset": "<integer>"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "data": {
            "type": "array",
            "items": {
              "type": "object",
              "properties": {
                "transferId": {
                  "type": "string",
                  "example": "TXN-20230527-00123",
                  "description": "Unique identifier for the transfer"
                },
                "sourceAccountId": {
                  "type": "string",
                  "example": "AC-9827364501-CHK",
                  "description": "Source account identifier"
                },
                "beneficiaryId": {
                  "type": "string",
                  "example": "BEN-ACH-00234",
                  "description": "Beneficiary identifier"
                },
                "amount": {
                  "type": "number",
                  "example": 2500,
                  "description": "Transfer amount",
                  "format": "double"
                },
                "currency": {
                  "type": "string",
                  "example": "USD",
                  "description": "ISO 4217 currency code"
                },
                "type": {
                  "type": "string",
                  "enum": [
                    "ach",
                    "wire",
                    "rtp"
                  ],
                  "description": "Payment rail type:\n- `ach`: Automated Clearing House — standard domestic (1-3 business days)\n- `wire`: Wire transfer — same-day domestic and international\n- `rtp`: Real-Time Payments — instant, domestic only\n"
                },
                "status": {
                  "type": "string",
                  "enum": [
                    "pending",
                    "scheduled",
                    "processing",
                    "completed",
                    "cancelled",
                    "failed"
                  ],
                  "description": "Current status of the transfer"
                },
                "fee": {
                  "type": "number",
                  "example": 0.5,
                  "description": "Fee charged for the transfer",
                  "format": "double"
                },
                "memo": {
                  "type": "string",
                  "example": "Monthly rent payment - Unit 4B",
                  "description": "Optional memo or reference note"
                },
                "estimatedDelivery": {
                  "type": "string",
                  "example": "2023-05-30T17:00:00Z",
                  "description": "Estimated delivery date and time",
                  "format": "date-time"
                },
                "createdAt": {
                  "type": "string",
                  "example": "2023-05-27T10:00:00Z",
                  "description": "Timestamp when the transfer was created",
                  "format": "date-time"
                },
                "updatedAt": {
                  "type": "string",
                  "example": "2023-05-27T10:05:00Z",
                  "description": "Timestamp when the transfer was last updated",
                  "format": "date-time"
                }
              }
            }
          },
          "total": {
            "type": "integer",
            "example": 42,
            "description": "Total number of matching transfers"
          },
          "limit": {
            "type": "integer",
            "example": 20,
            "description": "Number of results returned"
          },
          "offset": {
            "type": "integer",
            "example": 0,
            "description": "Pagination offset used"
          }
        }
      }
order: 1000
