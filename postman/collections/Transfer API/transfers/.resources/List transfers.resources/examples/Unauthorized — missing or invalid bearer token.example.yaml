      value: <date>
      disabled: false
      description: Filter start date
    - key: toDate
      value: <date>
      disabled: false
      description: Filter end date
    - key: status
      value: failed
      disabled: false
      description: Filter by transfer status
    - key: type
      value: wire
      disabled: false
      description: Filter by transfer type
    - key: limit
      value: "20"
      disabled: false
      description: Maximum number of results to return
    - key: offset
      value: "0"
      disabled: false
      description: Pagination offset
  body:
    type: text
    content: ""
