$kind: http-example
request:
  url: "{{baseUrl}}/transfers/validate"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "sourceAccountId": "AC12345678901234",
        "beneficiaryId": "BEN123456789",
        "amount": 1500,
        "currency": "string",
        "type": "rtp",
        "memo": "string"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "valid": true,
        "errors": [
          {
            "field": "string",
            "message": "string"
          },
          {
            "field": "string",
            "message": "string"
          }
        ],
        "warnings": [
          "string",
          "string"
        ]
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "valid": {
            "type": "boolean",
            "example": true,
            "description": "Whether the transfer request is valid"
          },
          "errors": {
            "type": "array",
            "description": "List of validation errors (empty if valid)",
            "items": {
              "type": "object",
              "properties": {
                "field": {
                  "type": "string",
                  "example": "amount",
                  "description": "The field that failed validation"
                },
                "message": {
                  "type": "string",
                  "example": "Amount exceeds daily transfer limit",
                  "description": "Description of the validation error"
                }
              }
            }
          },
          "warnings": {
            "type": "array",
            "description": "Non-blocking warnings about the transfer",
            "items": {
              "type": "object",
              "properties": {
                "field": {
                  "type": "string",
                  "example": "type"
                },
                "message": {
                  "type": "string",
                  "example": "RTP is not available for this destination bank"
                }
              }
            }
          }
        }
      }
order: 1000
