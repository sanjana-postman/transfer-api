$kind: http-example
request:
  url: "{{baseUrl}}/transfers/rails-quote"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "amount": 500,
        "currency": "USD",
        "beneficiaryId": "BEN-ACH-00234"
      }
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "error": "INVALID_REQUEST",
        "message": "The request is missing required fields",
        "details": [
          {
            "field": "amount",
            "message": "Must be a positive number"
          },
          {
            "field": "amount",
            "message": "Must be a positive number"
          }
        ]
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "error": {
            "type": "string",
            "example": "INVALID_REQUEST",
            "description": "Error code"
          },
          "message": {
            "type": "string",
            "example": "The request is missing required fields",
            "description": "Human-readable error message"
          },
          "details": {
            "type": "array",
            "description": "Additional error details",
            "items": {
              "type": "object",
              "properties": {
                "field": {
                  "type": "string",
                  "example": "amount"
                },
                "message": {
                  "type": "string",
                  "example": "Must be a positive number"
                }
              }
            }
          }
        }
      }
order: 4000
