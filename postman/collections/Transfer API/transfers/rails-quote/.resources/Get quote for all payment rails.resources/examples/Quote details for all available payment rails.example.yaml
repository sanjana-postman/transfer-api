$kind: http-example
request:
  url: "{{baseUrl}}/transfers/rails-quote"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "amount": 500,
        "currency": "USD",
        "beneficiaryId": "BEN-ACH-00234"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "amount": 500,
        "currency": "USD",
        "beneficiaryId": "BEN-ACH-00234",
        "rails": [
          {
            "rail": "ach",
            "fee": 0.5,
            "estimatedDelivery": "2023-05-30T17:00:00Z",
            "deliveryDescription": "1-3 business days",
            "available": true
          },
          {
            "rail": "ach",
            "fee": 0.5,
            "estimatedDelivery": "2023-05-30T17:00:00Z",
            "deliveryDescription": "1-3 business days",
            "available": true
          }
        ],
        "quotedAt": "2023-05-27T10:00:00Z",
        "expiresAt": "2023-05-27T10:15:00Z"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "amount": {
            "type": "number",
            "example": 500,
            "description": "The transfer amount quoted",
            "format": "double"
          },
          "currency": {
            "type": "string",
            "example": "USD"
          },
          "beneficiaryId": {
            "type": "string",
            "example": "BEN-ACH-00234"
          },
          "rails": {
            "type": "array",
            "description": "Quote details for each available payment rail",
            "items": {
              "type": "object",
              "properties": {
                "rail": {
                  "type": "string",
                  "enum": [
                    "ach",
                    "wire",
                    "rtp"
                  ],
                  "example": "ach",
                  "description": "Payment rail identifier"
                },
                "fee": {
                  "type": "number",
                  "example": 0.5,
                  "description": "Fee for this rail",
                  "format": "double"
                },
                "estimatedDelivery": {
                  "type": "string",
                  "example": "2023-05-30T17:00:00Z",
                  "description": "Estimated delivery date and time for this rail",
                  "format": "date-time"
                },
                "deliveryDescription": {
                  "type": "string",
                  "example": "1-3 business days",
                  "description": "Human-readable delivery time description"
                },
                "available": {
                  "type": "boolean",
                  "example": true,
                  "description": "Whether this rail is available for the given transfer"
                }
              }
            }
          },
          "quotedAt": {
            "type": "string",
            "example": "2023-05-27T10:00:00Z",
            "description": "Timestamp when the quote was generated",
            "format": "date-time"
          },
          "expiresAt": {
            "type": "string",
            "example": "2023-05-27T10:15:00Z",
            "description": "Timestamp when the quote expires",
            "format": "date-time"
          }
        }
      }
order: 1000
