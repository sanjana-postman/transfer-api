$kind: http-request
description: |
  Returns fee estimates and delivery times for all available payment rails
  (ACH, Wire, RTP) for a given transfer amount and destination.
  Enables comparison UX for end users before initiating a transfer.
url: "{{baseUrl}}/transfers/rails-quote"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "amount": 500,
      "currency": "USD",
      "beneficiaryId": "BEN-ACH-00234"
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "amount": {
          "type": "number",
          "minimum": 0.01,
          "example": 500,
          "description": "Transfer amount",
          "format": "double"
        },
        "currency": {
          "type": "string",
          "example": "USD",
          "description": "ISO 4217 currency code"
        },
        "beneficiaryId": {
          "type": "string",
          "example": "BEN-ACH-00234",
          "description": "The registered beneficiary identifier"
        }
      },
      "required": [
        "amount",
        "currency",
        "beneficiaryId"
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Get quote for all payment rails.resources/examples
order: 1000
