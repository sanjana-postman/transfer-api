$kind: http-request
description: Retrieve transfer history with optional filtering.
url: "{{baseUrl}}/transfers?fromDate=<date>&toDate=<date>&status=failed&type=wire&limit=20&offset=0"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: fromDate
    value: <date>
    disabled: false
    description: Filter start date
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "description": "Filter start date for transfer queries",
            "type": "string",
            "format": "date",
            "example": "2023-05-27"
          }
        }
      }
  - key: toDate
    value: <date>
    disabled: false
    description: Filter end date
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "description": "Filter end date for transfer queries",
            "type": "string",
            "format": "date",
            "example": "2023-05-27"
          }
        }
      }
  - key: status
    value: failed
    disabled: false
    description: Filter by transfer status
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "description": "Current status of the transfer",
            "type": "string",
            "enum": [
              "pending",
              "scheduled",
              "processing",
              "completed",
              "cancelled",
              "failed"
            ]
          }
        }
      }
  - key: type
    value: wire
    disabled: false
    description: Filter by transfer type
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "description": "Payment rail type:\n- `ach`: Automated Clearing House — standard domestic (1-3 business days)\n- `wire`: Wire transfer — same-day domestic and international\n- `rtp`: Real-Time Payments — instant, domestic only\n",
            "type": "string",
            "enum": [
              "ach",
              "wire",
              "rtp"
            ]
          }
        }
      }
  - key: limit
    value: "20"
    disabled: false
    description: Maximum number of results to return
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "description": "Maximum number of results to return",
            "type": "integer",
            "default": 20,
            "minimum": 1,
            "maximum": 100,
            "example": 20
          }
        }
      }
  - key: offset
    value: "0"
    disabled: false
    description: Pagination offset
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "description": "Pagination offset",
            "type": "integer",
            "default": 0,
            "minimum": 0,
            "example": 0
          }
        }
      }
body:
  type: text
  content: ""
examples: ./.resources/List transfers.resources/examples
order: 5000
