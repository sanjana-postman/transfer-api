$kind: http-request
url: "{{baseUrl}}/transfers"
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
  - key: x-mock-response-code
    value: "504"
    disabled: true
body:
  type: json
  content: |-
    {
      "sourceAccountId": "AC12345678901234",
      "beneficiaryId": "BEN123456789",
      "amount": 1500,
      "currency": "USD",
      "type": "rtp",
      "memo": "towards my loan",
      "scheduledDate": "2026-04-07"
    }
examples: ./.resources/Initiate transfer.resources/examples
order: 4000
