$kind: http-request
description: |
  Transfer funds across 3 payment rails: ACH, Wire Transfer, Real-Time Payments.

  Fees and processing times vary dynamically based on the payment rail type:
  - **ACH**: Lower fees, 1-3 business days processing
  - **Wire**: Higher fees, same-day or next-day processing
  - **RTP**: Moderate fees, instant processing

  These factors are also influenced by transfer amount and destination.
url: "{{baseUrl}}/transfers"
method: POST
headers:
  Content-Type: application/x-amz-json-1.0
  Accept: application/json
body:
  type: json
  content: |-
    {
      "sourceAccountId": "AC12345678901234",
      "beneficiaryId": "BEN123456789",
      "amount": 1500,
      "currency": "string",
      "type": "rtp",
      "memo": "string"
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "sourceAccountId": {
          "type": "string",
          "example": "AC-9827364501-CHK",
          "description": "The account ID to debit funds from"
        },
        "beneficiaryId": {
          "type": "string",
          "example": "BEN-ACH-00234",
          "description": "The registered beneficiary to credit funds to"
        },
        "amount": {
          "type": "number",
          "minimum": 0.01,
          "example": 2500,
          "description": "Amount to transfer (must be positive)",
          "format": "double"
        },
        "currency": {
          "type": "string",
          "example": "USD",
          "description": "ISO 4217 currency code"
        },
        "type": {
          "type": "string",
          "enum": [
            "ach",
            "wire",
            "rtp"
          ],
          "description": "Payment rail type:\n- `ach`: Automated Clearing House — standard domestic (1-3 business days)\n- `wire`: Wire transfer — same-day domestic and international\n- `rtp`: Real-Time Payments — instant, domestic only\n"
        },
        "memo": {
          "type": "string",
          "example": "Monthly rent payment - Unit 4B",
          "description": "Optional memo or reference note for the transfer"
        },
        "scheduledDate": {
          "type": "string",
          "example": "2023-06-01",
          "description": "Optional future date to schedule the transfer",
          "format": "date"
        }
      },
      "required": [
        "sourceAccountId",
        "beneficiaryId",
        "amount",
        "currency",
        "type"
      ]
    }
examples: ./.resources/Initiate transfer.resources/examples
order: 4000
