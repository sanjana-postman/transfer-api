$kind: http-request
description: Retrieve details for a specific transfer by its unique identifier.
url: "{{baseUrl}}/transfers/:transferId"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: transferId
    value: string
    disabled: false
    description: The unique identifier of the transfer
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "description": "The unique identifier of the transfer",
            "type": "string",
            "example": "TXN-20230527-00123"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: text
  content: ""
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
examples: ./.resources/Get transfer details.resources/examples
order: 2000
