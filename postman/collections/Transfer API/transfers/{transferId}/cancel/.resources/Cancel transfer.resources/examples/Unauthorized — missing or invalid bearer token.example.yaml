$kind: http-example
request:
  url: "{{baseUrl}}/transfers/:transferId/cancel"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: transferId
      value: string
      disabled: false
      description: The unique identifier of the transfer
  body:
    type: text
    content: ""
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "<string>",
        "message": "string",
        "details": [
          {
            "field": "<string>",
            "message": "<string>"
          },
          {
            "field": "<string>",
            "message": "<string>"
          }
        ]
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "error": {
            "type": "string",
            "example": "INVALID_REQUEST",
            "description": "Error code"
          },
          "message": {
            "type": "string",
            "example": "The request is missing required fields",
            "description": "Human-readable error message"
          },
          "details": {
            "type": "array",
            "description": "Additional error details",
            "items": {
              "type": "object",
              "properties": {
                "field": {
                  "type": "string",
                  "example": "amount"
                },
                "message": {
                  "type": "string",
                  "example": "Must be a positive number"
                }
              }
            }
          }
        }
      }
order: 3000
