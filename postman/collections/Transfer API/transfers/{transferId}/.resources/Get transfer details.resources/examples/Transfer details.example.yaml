$kind: http-example
request:
  url: "{{baseUrl}}/transfers/:transferId"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: transferId
      value: string
      disabled: false
      description: The unique identifier of the transfer
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "transferId": "TRF789012345",
        "sourceAccountId": "<string>",
        "beneficiaryId": "<string>",
        "amount": 1500,
        "currency": "USD",
        "type": "ach",
        "status": "completed",
        "fee": 25,
        "memo": "Invoice payment #12345",
        "estimatedDelivery": "<dateTime>",
        "createdAt": "2021-01-19T16:10:09.870Z",
        "updatedAt": "<dateTime>"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "transferId": {
            "type": "string",
            "example": "TXN-20230527-00123",
            "description": "Unique identifier for the transfer"
          },
          "sourceAccountId": {
            "type": "string",
            "example": "AC-9827364501-CHK",
            "description": "Source account identifier"
          },
          "beneficiaryId": {
            "type": "string",
            "example": "BEN-ACH-00234",
            "description": "Beneficiary identifier"
          },
          "amount": {
            "type": "number",
            "example": 2500,
            "description": "Transfer amount",
            "format": "double"
          },
          "currency": {
            "type": "string",
            "example": "USD",
            "description": "ISO 4217 currency code"
          },
          "type": {
            "type": "string",
            "enum": [
              "ach",
              "wire",
              "rtp"
            ],
            "description": "Payment rail type:\n- `ach`: Automated Clearing House — standard domestic (1-3 business days)\n- `wire`: Wire transfer — same-day domestic and international\n- `rtp`: Real-Time Payments — instant, domestic only\n"
          },
          "status": {
            "type": "string",
            "enum": [
              "pending",
              "scheduled",
              "processing",
              "completed",
              "cancelled",
              "failed"
            ],
            "description": "Current status of the transfer"
          },
          "fee": {
            "type": "number",
            "example": 0.5,
            "description": "Fee charged for the transfer",
            "format": "double"
          },
          "memo": {
            "type": "string",
            "example": "Monthly rent payment - Unit 4B",
            "description": "Optional memo or reference note"
          },
          "estimatedDelivery": {
            "type": "string",
            "example": "2023-05-30T17:00:00Z",
            "description": "Estimated delivery date and time",
            "format": "date-time"
          },
          "createdAt": {
            "type": "string",
            "example": "2023-05-27T10:00:00Z",
            "description": "Timestamp when the transfer was created",
            "format": "date-time"
          },
          "updatedAt": {
            "type": "string",
            "example": "2023-05-27T10:05:00Z",
            "description": "Timestamp when the transfer was last updated",
            "format": "date-time"
          }
        }
      }
order: 1000
