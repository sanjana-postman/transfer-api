name: Postman API Checks

# Trigger on push to main branch and pull requests targeting main
on: push
  

jobs:
  postman-api-checks:
    name: Sync, Lint & Test — Transfer API
    runs-on: ubuntu-latest

    steps:
      # ──────────────────────────────────────────────────────────────────────────
      # STEP 1: Check sync status between spec and collection; sync if out of sync
      # ──────────────────────────────────────────────────────────────────────────
      - name: Check and sync collection to spec
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
          WORKSPACE_ID: "f78c0f32-9c0a-4bea-976a-86ee0e96ba4d"
          SPEC_ID: "fa5e3177-a6bf-4af1-888a-a8e6c53c4326"
          COLLECTION_ID: "52921466-31ec18c1-369d-4209-84ca-17915ebc5bbb"
        run: |
          set -euo pipefail

          echo "::group::Fetching API ID from workspace"

          # 1. Fetch all APIs in the workspace to find the API ID dynamically
          APIS_RESPONSE=$(curl --silent --fail \
            --header "X-Api-Key: ${POSTMAN_API_KEY}" \
            "https://api.getpostman.com/apis?workspace=${WORKSPACE_ID}")

          echo "APIs response received."

          # Extract the first API ID from the response
          API_ID=$(echo "${APIS_RESPONSE}" | \
            python3 -c "import sys, json; apis = json.load(sys.stdin).get('apis', []); print(apis[0]['id'] if apis else '')")

          if [ -z "${API_ID}" ]; then
            echo "::error::Could not find any API in workspace ${WORKSPACE_ID}. Aborting."
            exit 1
          fi

          echo "Found API ID: ${API_ID}"
          # Export API ID to GITHUB_ENV so subsequent steps can reuse it
          echo "POSTMAN_API_ID=${API_ID}" >> "$GITHUB_ENV"

          echo "::endgroup::"

          echo "::group::Checking collection sync status"

          # 2. Fetch linked collections for this API and check sync status
          COLLECTIONS_RESPONSE=$(curl --silent --fail \
            --header "X-Api-Key: ${POSTMAN_API_KEY}" \
            "https://api.getpostman.com/apis/${API_ID}/collections")

          echo "Collections response received."

          # Extract the sync status for our specific collection
          SYNC_STATUS=$(echo "${COLLECTIONS_RESPONSE}" | \
            python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          collections = data.get('collections', [])
          target_id = '${COLLECTION_ID}'
          for col in collections:
              col_id = col.get('id', '') or col.get('uid', '')
              if col_id == target_id or col_id.endswith(target_id):
                  print(col.get('syncStatus', col.get('status', 'unknown')))
                  sys.exit(0)
          print('not-found')
          ")

          echo "Sync status for collection ${COLLECTION_ID}: ${SYNC_STATUS}"

          echo "::endgroup::"

          # 3. If not in-sync, trigger a sync and poll until complete
          if [ "${SYNC_STATUS}" != "in-sync" ]; then
            echo "::group::Triggering sync (status was '${SYNC_STATUS}')"

            SYNC_RESPONSE=$(curl --silent --fail --include \
              --request PUT \
              --header "X-Api-Key: ${POSTMAN_API_KEY}" \
              --header "Content-Type: application/json" \
              "https://api.getpostman.com/apis/${API_ID}/specs/${SPEC_ID}/collections/${COLLECTION_ID}/sync")

            echo "Sync triggered."

            # Extract the Location header for polling the task status
            LOCATION=$(echo "${SYNC_RESPONSE}" | grep -i "^location:" | awk '{print $2}' | tr -d '\r')

            if [ -z "${LOCATION}" ]; then
              echo "::warning::No Location header returned from sync request. Assuming sync completed synchronously."
            else
              echo "Polling task status at: ${LOCATION}"

              # 4. Poll the task status every 5 seconds, up to 60 seconds
              ELAPSED=0
              MAX_WAIT=60
              POLL_INTERVAL=5
              TASK_STATUS="pending"

              while [ "${ELAPSED}" -lt "${MAX_WAIT}" ]; do
                sleep "${POLL_INTERVAL}"
                ELAPSED=$((ELAPSED + POLL_INTERVAL))

                TASK_RESPONSE=$(curl --silent --fail \
                  --header "X-Api-Key: ${POSTMAN_API_KEY}" \
                  "${LOCATION}")

                TASK_STATUS=$(echo "${TASK_RESPONSE}" | \
                  python3 -c "import sys, json; d = json.load(sys.stdin); print(d.get('status', d.get('task', {}).get('status', 'unknown')))" 2>/dev/null || echo "unknown")

                echo "  [${ELAPSED}s] Task status: ${TASK_STATUS}"

                if [ "${TASK_STATUS}" = "completed" ] || [ "${TASK_STATUS}" = "success" ]; then
                  echo "Sync completed successfully."
                  break
                elif [ "${TASK_STATUS}" = "failed" ] || [ "${TASK_STATUS}" = "error" ]; then
                  echo "::error::Sync task failed with status '${TASK_STATUS}'."
                  exit 1
                fi
              done

              if [ "${TASK_STATUS}" != "completed" ] && [ "${TASK_STATUS}" != "success" ]; then
                echo "::error::Sync did not complete within ${MAX_WAIT} seconds. Last status: ${TASK_STATUS}"
                exit 1
              fi
            fi

            echo "::endgroup::"
          else
            echo "Collection is already in-sync with the spec. No sync needed."
          fi

      # ──────────────────────────────────────────────────────────────────────────
      # STEP 2: Lint the API spec using the Postman CLI
      # ──────────────────────────────────────────────────────────────────────────
      - name: Lint API spec
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
        run: |
          set -euo pipefail

          echo "::group::Installing Postman CLI"
          npm install -g @postman/cli
          echo "::endgroup::"

          echo "::group::Logging in to Postman CLI"
          postman login --with-api-key "${POSTMAN_API_KEY}"
          echo "::endgroup::"

          echo "::group::Linting API spec (API ID: ${POSTMAN_API_ID})"

          # POSTMAN_API_ID was exported to GITHUB_ENV in Step 1
          if [ -z "${POSTMAN_API_ID}" ]; then
            echo "::error::POSTMAN_API_ID is not set. Step 1 may have failed."
            exit 1
          fi

          # Lint the API — exits non-zero if lint violations are found
          postman api lint "${POSTMAN_API_ID}"

          echo "::endgroup::"

      # ──────────────────────────────────────────────────────────────────────────
      # STEP 3: Run collection tests and upload JUnit results as an artifact
      # ──────────────────────────────────────────────────────────────────────────
      - name: Run collection tests
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
        run: |
          set -euo pipefail

          echo "::group::Running collection tests"

          # Create output directory for JUnit results
          mkdir -p results

          # Run the Transfer API collection against the Transfer Remote Mock environment.
          # --bail stops the run on the first test failure.
          # --reporters cli,junit outputs results to the console and a JUnit XML file.
          postman collection run 52921466-31ec18c1-369d-4209-84ca-17915ebc5bbb \
            -e 52921466-a315960b-a042-40ad-8b3b-c623819330e0 \
            --reporters cli,junit \
            --reporter-junit-export results/junit.xml \
            --bail

          echo "::endgroup::"

      - name: Upload JUnit test results
        # Always upload results, even if the test run step failed, so results are
        # available for inspection. The job will still fail if tests failed.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-junit-results
          path: results/junit.xml
          retention-days: 30
